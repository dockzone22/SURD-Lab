name: Convert Publications Excel to JSON

on:
  push:
    paths:
      - 'data/publications.xlsx'
      - 'scripts/convert_publications.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl

      - name: Run Conversion Script
        run: |
          # Use local script path relative to checkout root
          python scripts/convert_publications.py

      - name: Commit and Push JSON Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/publications.json

          # Check if there are changes to commit
          if git diff --cached --quiet; then
            echo "No changes in publications.json to commit."
          else
            git commit -m "auto: Update publications.json from publications.xlsx"
            git push
          fi
